<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Journey - NewTune Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cinzel', serif;
      background: linear-gradient(135deg, #1e1e1e 0%, #121212 100%);
      color: #f5f5f5;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #e0c097;
      margin-bottom: 30px;
      text-shadow: 2px 2px 6px #000;
    }

    form {
      max-width: 700px;
      margin: 0 auto;
      background-color: rgba(34, 34, 34, 0.95);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: #e7c888;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 25px;
      border: none;
      border-radius: 6px;
      background-color: #2d2d2d;
      color: #fff;
      font-size: 1rem;
    }

    button {
      background-color: #c19b5c;
      border: none;
      padding: 14px 30px;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.3s ease;
      display: block;
      margin: 0 auto;
    }

    button:hover {
      background-color: #e1b871;
    }
  </style>
</head>
<body>
  <h1>Start Your Guitar Journey</h1>
  <form id="guitarForm">
    <label for="name">Your Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">

    <label for="guitarType">Which guitar do you want to learn?</label>
    <select id="guitarType" name="guitarType">
      <option value="acoustic">Acoustic</option>
      <option value="electric">Electric</option>
      <option value="both">Both</option>
    </select>

    <label for="experience">How would you describe your current skill level?</label>
    <select id="experience" name="experience">
      <option value="beginner">Total Beginner</option>
      <option value="basic">Know a few chords</option>
      <option value="intermediate">Can play songs</option>
      <option value="advanced">Advanced</option>
    </select>

    <label for="goals">What are your goals for guitar lessons?</label>
    <textarea id="goals" name="goals" rows="3" placeholder="e.g., Play songs I love, write my own music..."></textarea>

    <label for="recording">Are you interested in recording your playing or creating original songs?</label>
    <select id="recording" name="recording">
      <option value="yes">Yes</option>
      <option value="no">No</option>
      <option value="maybe">Maybe</option>
    </select>

    <label for="style">What genres or artists do you love?</label>
    <textarea id="style" name="style" rows="2"></textarea>

    <label for="days">Preferred days/times for lessons?</label>
    <textarea id="days" name="days" rows="2"></textarea>

    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById("guitarForm");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      fetch("https://formspree.io/f/mnqegzgr", {
        method: "POST",
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        window.location.href = "confirmation.html";
      }).catch(error => {
        alert("There was an error submitting the form. Please try again.");
      });
    });
  </script>
</body>
</html>
