<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Journey - NewTune Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cinzel', serif;
      background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
      color: #f5f5f5;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #e0c097;
      margin-bottom: 30px;
    }

    form {
      max-width: 700px;
      margin: 0 auto;
      background-color: #181818;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
      color: #d5b87d;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 25px;
      border: none;
      border-radius: 5px;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
    }

    button {
      background-color: #94794b;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      display: block;
      margin: 0 auto;
    }

    button:hover {
      background-color: #bfa066;
    }
  </style>
</head>
<body>
  <h1>Start Your Guitar Journey</h1>
  <form action="https://formspree.io/f/mnqegzgr" method="POST">
    <label for="name">Your Full Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">

    <label for="guitarType">Which guitar do you want to learn?</label>
    <select id="guitarType" name="guitarType">
      <option value="acoustic">Acoustic</option>
      <option value="electric">Electric</option>
      <option value="both">Both</option>
    </select>

    <label for="experience">How would you describe your current skill level?</label>
    <select id="experience" name="experience">
      <option value="beginner">Total Beginner</option>
      <option value="basic">Know a few chords</option>
      <option value="intermediate">Can play songs</option>
      <option value="advanced">Advanced</option>
    </select>

    <label for="goals">What are your goals for guitar lessons?</label>
    <textarea id="goals" name="goals" rows="3" placeholder="e.g., Play songs I love, write my own music..."></textarea>

    <label for="recording">Are you interested in recording your playing or creating original songs?</label>
    <select id="recording" name="recording">
      <option value="yes">Yes</option>
      <option value="no">No</option>
      <option value="maybe">Maybe</option>
    </select>

    <label for="style">What genres or artists do you love?</label>
    <textarea id="style" name="style" rows="2"></textarea>

    <label for="days">Preferred days/times for lessons?</label>
    <textarea id="days" name="days" rows="2"></textarea>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
