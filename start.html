<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Your Journey - NewTune Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: 'Cinzel', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    h2 {
      margin-bottom: 20px;
      color: #e0c097;
    }
    .question-box {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .question-box input, .question-box select, .question-box button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }
    button {
      background-color: #94794b;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #bfa066;
    }
  </style>
</head>
<body>
  <h2>Start Your Guitar Journey</h2>
  <div class="question-box" id="formContainer">
    <!-- Questions will be injected here by JavaScript -->
  </div>

  <script>
    const questions = [
      "What's your full name?",
      "What's your email address?",
      "What's your phone number?",
      "What guitar style are you interested in? (Acoustic or Electric)",
      "Have you ever played guitar before?",
      "Can you currently play any chords or songs?",
      "What song or style would you love to learn first?",
      "Do you have your own guitar?"
    ];

    const formData = [];
    let current = 0;

    function renderQuestion() {
      const container = document.getElementById("formContainer");
      container.innerHTML = "";

      const questionText = document.createElement("p");
      questionText.textContent = questions[current];
      container.appendChild(questionText);

      const input = document.createElement(
        current === 3 ? "select" : "input"
      );

      if (current === 3) {
        input.innerHTML = `
          <option value="">Select one</option>
          <option value="Acoustic">Acoustic</option>
          <option value="Electric">Electric</option>
        `;
      } else {
        input.type = "text";
      }

      container.appendChild(input);

      const nextBtn = document.createElement("button");
      nextBtn.textContent = current === questions.length - 1 ? "Submit" : "Next";
      nextBtn.onclick = () => {
        formData.push(input.value);
        if (current < questions.length - 1) {
          current++;
          renderQuestion();
        } else {
          // Final submission
          const finalInfo = questions.map((q, i) => `${q}: ${formData[i]}`).join("\n");
          alert("Thank you! Here's what you submitted:\n\n" + finalInfo);
        }
      };

      container.appendChild(nextBtn);
    }

    renderQuestion();
  </script>
</body>
</html>
