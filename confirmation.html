<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form Submitted</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cinzel', serif;
      background: linear-gradient(135deg, #1e1e1e, #121212);
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 20px;
    }

    .logo-container img {
      max-width: 300px;
      height: auto;
      border-radius: 10px;
    }

    .message {
      max-width: 500px;
      text-align: left;
    }

    .message h1 {
      color: #e0c097;
      margin-bottom: 20px;
      text-shadow: 2px 2px 6px #000;
    }

    .message p {
      color: #ccc;
      margin-bottom: 30px;
    }

    .message a {
      background-color: #c19b5c;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      display: inline-block;
    }

    .message a:hover {
      background-color: #e1b871;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }

      .message {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="Images/D8FD2866-41AB-4195-859B-79A73998A596.PNG" alt="NewTune Studio Logo">
    </div>
    <div class="message">
      <h1>🎉 You're All Set!</h1>
      <p>Thanks for submitting your guitar journey form. I’ll be in touch soon with availability and options.</p>
      <a href="index.html">Return to Home</a>
    </div>
  </div>
</body>
</html>
