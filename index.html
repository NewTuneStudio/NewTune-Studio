<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NewTune Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cinzel', serif;
      background: url('https://images.unsplash.com/photo-1607990283143-e81e7f50f98f?auto=format&fit=crop&w=1950&q=80') no-repeat center center/cover;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .logo-left {
      position: absolute;
      top: 0;
      left: 0;
      height: 120px;
      width: auto;
      object-fit: contain;
    }

    header h1 {
      font-size: 3rem;
      color: #e0c097;
      text-shadow: 2px 2px 8px #000;
    }

    nav {
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px 0;
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
    }

    nav a {
      color: #e0c097;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #ffffff;
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 40px;
    }

    .hero h2 {
      font-size: 2.8rem;
      color: #f5f5f5;
      margin-bottom: 20px;
      text-shadow: 1px 1px 4px #000;
    }

    .hero p {
      font-size: 1.1rem;
      max-width: 700px;
      color: #ddd;
      text-shadow: 1px 1px 2px #000;
    }

    footer {
      background-color: rgba(0, 0, 0, 0.7);
      color: #aaa;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="Images/D8FD2866-41AB-4195-859B-79A73998A596.PNG" alt="Logo" class="logo-left">
    <h1>NewTune Studio</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="book.html">Pricing & Availability</a>
    <a href="lesson.html">Ogden Lessons</a>
    <a href="music.html">My Music</a>
    <a href="about.html">About Me</a>
  </nav>

  <section class="hero">
    <h2>Welcome to NewTune Studio</h2>
    <p>Explore personalized guitar lessons that go beyond technique — transforming your playing into polished productions.</p>
  </section>

  <footer>
    &copy; 2025 NewTune Studio. All rights reserved.
  </footer>
</body>
</html>
